name: Review

on:
  pull_request:

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # The review is posted back to the pull request as a comment.
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the agent can diff the pull request against its base.
          fetch-depth: 0

      - name: Review
        uses: ./actions/review
        with:
          skill: actions/review/skills/review
          model: opencode/glm-5.3-flash-free#high
          fast-model: opencode/glm-5.3-flash-free#low
          min-severity: medium
