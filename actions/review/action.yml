name: OpenLoop Review
description: Run an OpenCode review agent using a skill

inputs:
  skill:
    description: Path to a skill directory (containing SKILL.md) or a skill file to run
    required: true

  model:
    description: Model that runs the review, as `provider/model`. Credentials for its provider must be in the environment, such as `ANTHROPIC_API_KEY`
    required: false
    default: anthropic/claude-sonnet-5-5

  comment:
    description: Post the review as a comment on the pull request that triggered the run
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile

    - name: Run review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_SKILL: ${{ inputs.skill }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_COMMENT: ${{ inputs.comment }}
        ACTION_DIR: ${{ github.action_path }}
        # Commenting needs `pull-requests: write` on the calling workflow.
        GH_TOKEN: ${{ github.token }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bun "$ACTION_DIR/src/index.ts"
